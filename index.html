<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#193b58">
  <meta name="description" content="Management console for the Plasmod agent-native database">
  <title>Plasmod Database Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview" aria-label="Plasmod Home"><img src="assets/plasmod.png" alt="Plasmod Agent-native database"></a>
    <div class="sidebar-caption">DATABASE CONSOLE <span>v1.0</span></div>
    <nav id="navigation" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom"><div class="local-instance"><i class="dot"></i><div><strong>Local instance</strong><small>127.0.0.1</small></div><span class="connection-icon">⌁</span></div><div class="company"><span>POWERED BY</span><div class="company-logo"><img src="assets/codesoul.png" alt="CodeSoul"></div></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumbs"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="Open navigation">☰</button><span class="server-icon">▤</span><span>Plasmod Console</span><span class="slash">/</span><strong id="breadcrumb">Database Overview</strong></div><div class="topbar-right"><span class="avatar">CS</span></div></header>
    <div class="contextbar"><div class="scope-fields"><label>Tenant <select id="tenant"><option value="codesoul">codesoul</option></select></label><span class="context-divider"></span><label>Workspace <select id="workspace"><option value="default">default</option><option value="sandbox">sandbox</option></select></label></div></div>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>Plasmod <span class="muted">/</span> Agent-native database</span><span>CodeSoul © 2026</span></footer>
  </div>
  <div id="overlay-root"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
